<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавление рецепта — шаг 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="draft.js" defer></script>
  <script src="step-3.js" defer></script>
  <script src="close-dialog.js" defer></script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M12 5L5 12L12 19" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6H5M5 6H21M5 6V20C5 20.5304 5.21071 21.0391 5.58579 21.4142C5.96086 21.7893 6.46957 22 7 22H17C17.5304 22 18.0391 21.7893 18.4142 21.4142C18.7893 21.0391 19 20.5304 19 20V6M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8V12M12 16H12.01" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><path d="M9 5H9.01M9 12H9.01M9 19H9.01M15 5H15.01M15 12H15.01M15 19H15.01" stroke="currentColor" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V8C1 7.46957 1.21071 6.96086 1.58579 6.58579C1.96086 6.21071 2.46957 6 3 6H7L9 3H15L17 6H21C21.5304 6 22.0391 6.21071 22.4142 6.58579C22.7893 6.96086 23 7.46957 23 8V19Z" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 17C14.2091 17 16 15.2091 16 13C16 10.7909 14.2091 9 12 9C9.79086 9 8 10.7909 8 13C8 15.2091 9.79086 17 12 17Z" stroke="currentColor" stroke-width="1.67" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="screen" id="screen">

  <header class="formhead">
    <div class="formbar">
      <a class="btn btn--ghost btn--icon formbar__back" href="screen-3.html" aria-label="Назад"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-left"/></svg></a>
      <h1 class="formbar__title t-title-l">Добавление рецепта</h1>
      <a class="btn btn--ghost btn--icon formbar__close" href="screen-1.html" aria-label="Закрыть"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></a>
    </div>
    <div class="stepper" role="group" aria-label="Шаг 3 из 4">
      <ol class="stepper__track"><li class="stepper__segment is-success"></li><li class="stepper__segment is-success"></li><li class="stepper__segment is-current" aria-current="step"></li><li class="stepper__segment"></li></ol>
      <p class="stepper__label">Шаг 3 из 4. Шаги приготовления</p>
    </div>
  </header>

  <main class="screen__main">
    <form class="form" id="recipe-form" action="screen-5.html" novalidate>

      <ol class="stack" id="step-list"></ol>
      <div class="ingredient-empty" id="step-empty" hidden>
        <p class="ingredient-empty__title">Шагов пока нет</p>
        <p class="ingredient-empty__hint" id="step-empty-hint">Добавьте хотя бы 1 шаг</p>
      </div>
      <button class="btn btn--secondary btn--block" id="add-step" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg>Добавить шаг</button>

      <p class="visually-hidden" id="step-status" role="status"></p>

    </form>
  </main>

  <div class="form__footer">
    <button class="btn btn--primary btn--block" type="submit" form="recipe-form">Дальше</button>
  </div>

</div>

<template id="step-template">
  <li class="recipe-step">
    <div class="recipe-step__bar">
      <span class="recipe-step__handle" aria-hidden="true"><svg class="icon" focusable="false"><use href="#i-grip"/></svg></span>
      <h2 class="recipe-step__title"></h2>
      <button class="btn btn--ghost btn--icon" data-remove type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-trash"/></svg></button>
    </div>
    <div class="input" data-part="field">
      <label class="input__label" data-part="label">Описание шага</label>
      <div class="input__control"><textarea class="input__field input__field--textarea" data-part="text" name="step-text[]" rows="3" placeholder="Например: Нарежьте картофель кубиками"></textarea></div>
      <p class="message is-error" data-part="text-error" role="alert" hidden><svg class="icon icon--s" aria-hidden="true" focusable="false"><use href="#i-alert"/></svg><span>Опишите шаг</span></p>
    </div>
    <div class="upload upload--compact" data-part="upload">
      <input class="upload__input" data-part="photo" name="step-photo[]" type="file" accept="image/*">
      <label class="upload__frame" data-part="frame"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-camera"/></svg><span class="upload__title">Добавить фото</span></label>
      <div class="upload__frame" data-part="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span><span class="upload__title">Загружаем фото…</span></div>
      <div class="upload__preview" data-part="preview" hidden>
        <img class="card__media" data-part="image" alt="">
        <div class="upload__actions">
          <button class="btn btn--secondary btn--icon" data-part="replace" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-camera"/></svg></button>
          <button class="btn btn--secondary btn--icon" data-part="remove" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-trash"/></svg></button>
        </div>
      </div>
      <p class="message is-error" data-part="photo-error" role="alert" hidden><svg class="icon icon--s" aria-hidden="true" focusable="false"><use href="#i-alert"/></svg><span>Не удалось загрузить фото. Попробуйте ещё раз</span></p>
    </div>
  </li>
</template>

<div class="overlay overlay--center" id="exit-dialog">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exit-title" aria-describedby="exit-text">
    <h2 class="dialog__title" id="exit-title">Сохранить как черновик?</h2>
    <p class="dialog__text" id="exit-text">Вы выходите из формы добавления рецепта. Черновик можно будет продолжить позже.</p>
    <div class="dialog__actions">
      <a class="btn btn--primary btn--block" href="screen-1.html">Сохранить в черновик</a>
      <a class="btn btn--secondary btn--block" id="exit-discard" href="screen-1.html">Не сохранять</a>
      <button class="btn btn--ghost btn--block" id="exit-cancel" type="button">Продолжить заполнение</button>
    </div>
  </div>
</div>

</body>
</html>
